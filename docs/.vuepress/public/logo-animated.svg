<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Heavy Chain -->
  <path class="chain heavy-left" d="M100 180 L100 100 L60 40" stroke="url(#grad1)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Heavy Chain -->
  <path class="chain heavy-right" d="M100 180 L100 100 L140 40" stroke="url(#grad1)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Left Light Chain -->
  <path class="chain light-left" d="M80 80 L50 35" stroke="#60a5fa" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Light Chain -->
  <path class="chain light-right" d="M120 80 L150 35" stroke="#34d399" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Connecting Disulfide Bonds (Simplified as dots/lines) -->
  <circle class="bond" cx="100" cy="110" r="3" fill="#ffffff" />
  <circle class="bond" cx="100" cy="120" r="3" fill="#ffffff" />

  <style>
    .chain {
      opacity: 0;
      animation: draw 2s ease-out forwards, float 6s ease-in-out infinite 2s;
    }
    
    .heavy-left { animation-delay: 0s, 2s; }
    .heavy-right { animation-delay: 0.2s, 2s; }
    .light-left { animation-delay: 0.5s, 2.2s; }
    .light-right { animation-delay: 0.7s, 2.2s; }
    
    .bond {
      opacity: 0;
      animation: fade-in 1s ease-out forwards 1.5s;
    }

    @keyframes draw {
      0% {
        opacity: 0;
        stroke-dasharray: 200;
        stroke-dashoffset: 200;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        stroke-dasharray: 200;
        stroke-dashoffset: 0;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    @keyframes fade-in {
      from { opacity: 0; transform: scale(0); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</svg>