<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="BioCloudHub antibody icon">
  <defs>
    <linearGradient id="logo-bg" x1="40" y1="28" x2="220" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#30c2f4" />
      <stop offset="0.48" stop-color="#169bd8" />
      <stop offset="1" stop-color="#0a78c8" />
    </linearGradient>
    <radialGradient id="logo-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(88 62) rotate(37) scale(148)">
      <stop offset="0" stop-color="#9ce7ff" stop-opacity="0.5" />
