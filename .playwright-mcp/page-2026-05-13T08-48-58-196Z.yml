          - paragraph [ref=e1123]: 溶解氧（DO）和 pH 是细胞培养过程中最核心的两个调控参数，二者之间存在密切的相互影响，大规模培养中的管理难度显著高于小规模。
          - paragraph [ref=e1124]:
            - strong [ref=e1125]: 溶解氧（DO）的控制
          - paragraph [ref=e1126]: 氧气是细胞有氧代谢不可或缺的物质，细胞直接利用溶解于培养液中的氧。
          - list [ref=e1127]:
            - listitem [ref=e1128]:
              - strong [ref=e1129]: 生理需求：
              - text: 哺乳动物细胞通常需要维持 DO 在 30%～40%（空气饱和度），过低（<10%）导致缺氧代谢（乳酸大量积累），过高（>80%）则可能产生氧化应激，影响细胞健康和糖基化质量。
            - listitem [ref=e1130]:
              - strong [ref=e1131]: 通气策略组合：
          - table [ref=e1132]:
            - rowgroup [ref=e1133]:
              - row "分布器类型 气泡尺寸 主要功能" [ref=e1134]:
