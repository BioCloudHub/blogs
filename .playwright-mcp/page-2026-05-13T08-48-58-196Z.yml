          - list [ref=e1181]:
            - listitem [ref=e1182]:
              - paragraph [ref=e1183]:
                - strong [ref=e1184]: 碱液选择的工程考量：
              - list [ref=e1185]:
                - listitem [ref=e1186]: 低浓度碱液（如 0.5M NaHCO₃）可减少局部 pH 过冲，但会向体系引入更多液体，影响渗透压；
                - listitem [ref=e1187]: 高浓度碱液（如 2M Na₂CO₃）体积小但局部浓度冲击大，需配合良好的混合条件；
                - listitem [ref=e1188]: 进液位置应避免直接接触细胞密集区或气液界面。
            - listitem [ref=e1189]:
              - paragraph [ref=e1190]:
                - strong [ref=e1191]: pCO₂ 的平衡：
                - text: 碱液的加入会影响碳酸盐缓冲体系中 CO₂ 的溶解平衡，需同时通过排气策略控制 pCO₂ 在合理范围（30～60 mmHg），防止对糖基化质量产生影响。
