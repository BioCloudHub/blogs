          - list [ref=e529]:
            - listitem [ref=e530]: 经验放大法偏重积累数据、验证效果，可靠但周期长；
            - listitem [ref=e531]: 相似放大法基于数学模型，效率高但对参数获取和建模能力要求高；
            - listitem [ref=e532]: 实际项目中通常结合使用，以相似放大法确定参数方向，以经验放大法逐级验证并修正。
