                - cell "烈性/致命微生物（可治愈）" [ref=e1343]
                - cell "Ⅱ级（全排风 B2 型）或 Ⅲ级" [ref=e1344]
              - row "BSL-4 烈性/致命微生物（不可治愈） Ⅲ级全排风 / 正压防护服 + Ⅱ-B 级" [ref=e1345]:
                - cell "BSL-4" [ref=e1346]
                - cell "烈性/致命微生物（不可治愈）" [ref=e1347]
                - cell "Ⅲ级全排风 / 正压防护服 + Ⅱ-B 级" [ref=e1348]
          - paragraph [ref=e1349]:
            - strong [ref=e1350]: 特殊情形：
            - text: 若操作涉及挥发性有机溶剂、化学致癌物或放射性物质，必须选用 Ⅱ-B2 型（全排风）或 Ⅲ级安全柜，不可使用部分循环风型安全柜。
          - paragraph [ref=e1351]:
            - strong [ref=e1352]: 关键操作规范
          - list [ref=e1353]:
            - listitem [ref=e1354]: 工作开始前将所有物品一字排开放入柜内，减少双臂进出次数（每次进出打破气流平衡）；
            - listitem [ref=e1355]: 前排和后排回风格栅上严禁放置物品（堵塞格栅将破坏气流循环）；
            - listitem [ref=e1356]: 开始工作前及完成后各维持气流循环一段时间，完成自净过程；
            - listitem [ref=e1357]: 柜内物品移动遵循"从清洁区到污染区"原则；
            - listitem [ref=e1358]: 禁止在安全柜内使用明火（高温颗粒会损伤 HEPA 膜）；
            - listitem [ref=e1359]: 禁止将离心机、振荡器等振动设备安置在安全柜内（颗粒物脱落 + 气流干扰）。
