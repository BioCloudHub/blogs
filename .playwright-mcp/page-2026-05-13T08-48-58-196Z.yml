              - row "大泡分布器（open pipe） 毫米级 大流量通气，辅助排除 CO₂，避免 CO₂ 积累" [ref=e1143]:
                - cell "大泡分布器（open pipe）" [ref=e1144]
                - cell "毫米级" [ref=e1145]
                - cell "大流量通气，辅助排除 CO₂，避免 CO₂ 积累" [ref=e1146]
              - row "顶部空间通气 —— 补充 O₂/CO₂ 平衡，贡献随规模增大而降低" [ref=e1147]:
                - cell "顶部空间通气" [ref=e1148]
                - cell "——" [ref=e1149]
                - cell "补充 O₂/CO₂ 平衡，贡献随规模增大而降低" [ref=e1150]
          - list [ref=e1151]:
            - listitem [ref=e1152]:
              - strong [ref=e1153]: 大规模放大中的 DO 梯度问题：
              - text: 随着体积增大，反应器内 DO 可能呈现不均匀分布（底部高、顶部低，或进气点附近高、远端低），显著影响细胞代谢一致性，严重时还可能影响 N-糖基化谱。
          - paragraph [ref=e1154]:
            - strong [ref=e1155]: pH 的动态调控
          - paragraph [ref=e1156]: pH 是影响细胞酶活性、膜离子通道和产品质量属性的关键参数，典型控制范围为 6.8～7.4（常用目标值 7.0±0.1）。
          - list [ref=e1157]:
            - listitem [ref=e1158]:
              - strong [ref=e1159]: pH 下降的来源：
              - text: 细胞代谢产生乳酸（糖酵解副产物）；通气引入过多 CO₂，增加碳酸浓度。
            - listitem [ref=e1160]:
              - strong [ref=e1161]: pH 调控手段：
          - table [ref=e1162]:
            - rowgroup [ref=e1163]:
              - row "手段 适用场景 注意事项" [ref=e1164]:
