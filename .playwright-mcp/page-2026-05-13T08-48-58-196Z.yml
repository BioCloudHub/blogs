              - row "化学参数 培养基组成、渗透压、葡萄糖浓度、谷氨酰胺 影响细胞生长动力学与代谢副产物积累" [ref=e375]:
                - cell "化学参数" [ref=e376]
                - cell "培养基组成、渗透压、葡萄糖浓度、谷氨酰胺" [ref=e377]
                - cell "影响细胞生长动力学与代谢副产物积累" [ref=e378]
              - row "生物学参数 接种密度、传代代次、补料策略 影响蛋白表达量与糖基化等质量属性" [ref=e379]:
                - cell "生物学参数" [ref=e380]
                - cell "接种密度、传代代次、补料策略" [ref=e381]
                - cell "影响蛋白表达量与糖基化等质量属性" [ref=e382]
          - paragraph [ref=e383]:
            - strong [ref=e384]: 工艺优化策略
          - list [ref=e385]:
            - listitem [ref=e386]:
              - strong [ref=e387]: DoE（Design of Experiment）：
              - text: 通过部分因子或全因子实验设计系统筛选 CPPs（关键工艺参数），建立参数与 CQAs 之间的定量关系，支撑设计空间（Design Space）的确立。
            - listitem [ref=e388]:
              - strong [ref=e389]: 高通量微型反应器平台（如 ambr® 系列）：
              - text: 在 15ml～250ml 规模实现多条件并行优化，显著压缩开发周期。
            - listitem [ref=e390]:
              - strong [ref=e391]: 代谢流分析（Metabolic Flux Analysis）：
              - text: 解析乳酸/氨积累成因，指导补料策略。
            - listitem [ref=e392]:
              - strong [ref=e393]: 补料工艺优化：
              - text: 补料时机、补料量与补料液组成直接影响细胞密度峰值和目标蛋白糖基化分布。
          - paragraph [ref=e394]:
            - strong [ref=e395]: 开发阶段与监管要求的对应关系
          - list [ref=e396]:
            - listitem [ref=e397]:
              - strong [ref=e398]: IND 阶段：
              - text: 参数设定可依赖平台经验和先验知识，不要求系统性研究，重点保证一致性和安全性。
            - listitem [ref=e399]:
              - strong [ref=e400]: BLA 申报阶段：
              - text: 须对每个参数的目标值和控制范围进行全面研究，鉴定 CPPs 并建立经验证的设计空间，提供多批数据支持。
