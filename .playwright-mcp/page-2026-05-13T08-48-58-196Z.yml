            - listitem [ref=e1057]:
              - strong [ref=e1058]: 监管节点：
              - text: 临床三期样品生产前须基本锁定生产规模工艺，完成 PC（过程确认）研究，随后进行 PPQ（工艺性能确认）研究，作为 BLA 申报的核心支撑数据。
