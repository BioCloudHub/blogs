            - strong [ref=e1322]: 核心功能
          - paragraph [ref=e1323]: 生物安全柜通过 HEPA 过滤和定向气流，同时保护：① 操作人员（防止气溶胶暴露）；② 实验样品（防止环境污染）；③ 环境（防止有害物质扩散）。
