        - generic [ref=e536]:
          - paragraph [ref=e537]:
            - generic [ref=e539]: 回答
            - generic [ref=e540] [cursor=pointer]: BioCloudHub 点击复制为图片
          - paragraph [ref=e541]:
            - strong [ref=e542]: 方法定义
          - paragraph [ref=e543]: 经验放大法（Empirical Scale-up）是指在放大过程缺乏充分理论依据时，依靠小规模试验的成功数据和开发人员的工程经验，通过逐步扩大规模（实验装置→中间装置→中型装置→大型装置）的方式，反复验证和修正工艺参数，最终实现规模转移的方法。
          - paragraph [ref=e544]:
            - strong [ref=e545]: 核心优势
          - list [ref=e546]:
            - listitem [ref=e547]: 每次放大都以实验数据为基础，至少经历一次中试验证，结论可靠度高；
            - listitem [ref=e548]: 对理论建模能力依赖低，适合早期开发或复杂体系；
            - listitem [ref=e549]: 可直接发现实际操作中难以预测的工程问题。
          - paragraph [ref=e550]:
            - strong [ref=e551]: 主要局限
          - list [ref=e552]:
            - listitem [ref=e553]: 缺乏理论指导，问题出现时难以快速定位原因及提出解决方案；
            - listitem [ref=e554]: 每次放大均需搭建装置、消耗物料，开发成本高；
            - listitem [ref=e555]: 因单次放大倍数不宜过大（通常 ≤10 倍），开发周期较长；
            - listitem [ref=e556]: 对开发人员的经验积累要求较高。
          - paragraph [ref=e557]:
            - strong [ref=e558]: 适用前提与使用要点
          - list [ref=e559]:
            - listitem [ref=e560]: 放大后的反应装置必须与提供经验数据的装置保持相同（或高度相似）的操作条件；
            - listitem [ref=e561]: 放大倍数不宜太大，反应器搅拌形式和结构应相似；
            - listitem [ref=e562]:
              - text: 实际放大中最常用的等效标准为：
              - strong [ref=e563]: 单位体积搅拌功率（P/V）相同
              - text: 或
              - strong [ref=e564]: 体积氧传质系数（KLa）相同
              - text: ，两者可视具体工艺单独或联合使用。
