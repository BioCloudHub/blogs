          - link "上游工艺四步骤描述：细胞复苏→种子扩增→反应器生产→收获的操作规范与中间体控制" [ref=e403] [cursor=pointer]:
            - /url: "#上游工艺四步骤描述-细胞复苏→种子扩增→反应器生产→收获的操作规范与中间体控制"
        - generic [ref=e404]:
          - paragraph [ref=e405]:
            - generic [ref=e407]: 回答
            - generic [ref=e408] [cursor=pointer]: BioCloudHub 点击复制为图片
          - paragraph [ref=e409]: 典型的抗体药物上游细胞培养工艺由以下四个工序串联组成，每个工序均有明确的目的、方法原理和中间体控制要求。
          - paragraph [ref=e410]:
            - strong [ref=e411]: 步骤一：细胞复苏（Cell Thawing & Recovery）
          - list [ref=e412]:
            - listitem [ref=e413]:
              - strong [ref=e414]: 工序目的：
              - text: 将冻存于液氮中的工作细胞库（WCB）或主细胞库（MCB）种子细胞快速解冻，为后续传代扩增提供活细胞起点。
            - listitem [ref=e415]:
              - strong [ref=e416]: 方法原理：
              - text: 37℃水浴快速解冻（通常在 180 秒内完成），减少细胞因冰晶重结晶造成的损伤；解冻后转入预热培养基中洗去保护剂（DMSO）。
            - listitem [ref=e417]:
              - strong [ref=e418]: 中间体控制指标：
              - text: 复苏后活细胞密度、细胞活率。
            - listitem [ref=e419]:
              - strong [ref=e420]: 《中国药典》三部要求：
              - text: 冻存前细胞活力 ≥90%；复苏后细胞活力 ≥80%。
          - paragraph [ref=e421]:
            - strong [ref=e422]: 步骤二：种子传代与扩增（Seed Train Expansion）
          - list [ref=e423]:
            - listitem [ref=e424]:
              - strong [ref=e425]: 工序目的：
              - text: 逐步扩大细胞数量，为生物反应器生产级提供充足、合格的种子细胞。
            - listitem [ref=e426]:
              - strong [ref=e427]: 方法原理：
              - text: 摇瓶逐级扩大（如 T 瓶→摇瓶→波浪袋→种子反应器）；条件允许时采用与生产反应器同类型的种子反应器，使细胞提前适应相似的培养环境。
            - listitem [ref=e428]:
              - strong [ref=e429]: 中间体控制指标：
              - text: 每代接种活细胞密度与活率、传代后活细胞密度与活率、培养天数、培养体积。
            - listitem [ref=e430]:
              - strong [ref=e431]: 监管要求：
              - text: 应限定最高传代代次（Population Doubling Level, PDL），最高限定代次的确定应基于：细胞表型/基因型特性、表达载体的分子完整性与一致性、生产末期宿主细胞/载体的一致性研究（如质粒拷贝数及状态）。试验涉及的传代范围应等于或超过规定的最高限定代次。
          - paragraph [ref=e432]:
            - strong [ref=e433]: 步骤三：生物反应器生产（Bioreactor Production）
          - list [ref=e434]:
            - listitem [ref=e435]:
              - strong [ref=e436]: 工序目的：
              - text: 在大规模反应器中使细胞高效表达足量且质量符合要求的目标蛋白，供下游纯化使用。
            - listitem [ref=e437]:
              - strong [ref=e438]: 方法原理：
              - text: 采用搅拌式生物反应器（不锈钢或一次性），常见规模为 200L→500L→1000L→2000L→5000L→20000L；培养模式通常为补料批次（Fed-batch）。
            - listitem [ref=e439]:
              - strong [ref=e440]: 核心控制参数：
          - table [ref=e441]:
            - rowgroup [ref=e442]:
              - row "参数 典型控制方式" [ref=e443]:
                - columnheader "参数" [ref=e444]
                - columnheader "典型控制方式" [ref=e445]
            - rowgroup [ref=e446]:
              - row "初始接种密度 根据种子扩增末代密度计算，设定目标值与范围" [ref=e447]:
                - cell "初始接种密度" [ref=e448]
                - cell "根据种子扩增末代密度计算，设定目标值与范围" [ref=e449]
              - row "接种细胞活率 通常要求 ≥90%" [ref=e450]:
                - cell "接种细胞活率" [ref=e451]
                - cell "通常要求 ≥90%" [ref=e452]
              - row "培养温度 常规 36～37℃，可通过温度偏移策略调控糖基化" [ref=e453]:
                - cell "培养温度" [ref=e454]
                - cell "常规 36～37℃，可通过温度偏移策略调控糖基化" [ref=e455]
              - row "pH 典型 7.0～7.2，碱液（NaHCO₃/Na₂CO₃）+ CO₂双向调控" [ref=e456]:
                - cell "pH" [ref=e457]
                - cell "典型 7.0～7.2，碱液（NaHCO₃/Na₂CO₃）+ CO₂双向调控" [ref=e458]
              - row "溶氧（DO） 哺乳动物细胞通常维持在 30%～40% 空气饱和度" [ref=e459]:
                - cell "溶氧（DO）" [ref=e460]
                - cell "哺乳动物细胞通常维持在 30%～40% 空气饱和度" [ref=e461]
              - row "搅拌转速 依放大准则（P/V 或叶尖速度）换算设定" [ref=e462]:
                - cell "搅拌转速" [ref=e463]
                - cell "依放大准则（P/V 或叶尖速度）换算设定" [ref=e464]
              - row "培养天数 通常 10～14 天（Fed-batch）" [ref=e465]:
                - cell "培养天数" [ref=e466]
                - cell "通常 10～14 天（Fed-batch）" [ref=e467]
          - list [ref=e468]:
            - listitem [ref=e469]:
              - strong [ref=e470]: IND vs. BLA 阶段差异：
              - text: IND 阶段可沿用平台经验设定参数范围；BLA 阶段须系统鉴定 CPPs，建立设计空间，确立影响 KPAs（关键性能属性）的 KPPs 并严格控制。
          - paragraph [ref=e471]:
            - strong [ref=e472]: 步骤四：细胞培养液收获（Harvest）
          - list [ref=e473]:
            - listitem [ref=e474]:
              - strong [ref=e475]: 工序目的：
              - text: 从生物反应器收集含目标蛋白的培养上清，转入下游纯化工序。
            - listitem [ref=e476]:
              - strong [ref=e477]: 方法原理：
              - text: 通过离心或深层过滤澄清收获液（去除细胞及细胞碎片），收集于储液袋后进入下游处理。
            - listitem [ref=e478]:
              - strong [ref=e479]: 中间体控制指标：
              - text: 收获时活细胞密度、细胞活率、浊度、蛋白含量、细菌内毒素、支原体。
            - listitem [ref=e480]:
              - strong [ref=e481]: 法规要求摘要（《中国药典》三部·人用重组单克隆抗体制品总论）：
              - text: 每次收获均应检测抗体含量、细菌内毒素及支原体；应在合适阶段进行常规或特定的外源病毒污染检查；对限定传代次数的生产方式，至少对 3 次收获物进行体外外源病毒检测。
            - listitem [ref=e482]:
              - strong [ref=e483]: 企业实践：
              - text: 通常对收获液进行 UPB（Unprocessed Bulk）检测，控制培养过程污染；同时将收获细胞传代冻存，建立 EOPC（End of Production Cells），用于检测种子污染情况，其检测项目与 WCB/MCB 相似。
