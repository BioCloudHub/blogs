          - paragraph [ref=e360]: 细胞培养工艺开发（Cell Culture Process Development）旨在建立一套可重复、可放大、产品质量稳定的细胞培养方案，核心目标是：在可接受的细胞密度与活率下，最大化目标蛋白的产量与质量属性（CQAs）。
