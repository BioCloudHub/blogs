          - paragraph [ref=e1283]:
            - text: 细胞对生长环境的要求远比微生物严苛——须维持严格的无菌条件、温度和气体环境，并对机械剪切力保持高度敏感性。上游细胞培养涉及的核心设备主要包括：
            - strong [ref=e1284]: 摇床（Shaker/Incubator Shaker）、生物安全柜（Biological Safety Cabinet, BSC）、生物反应器（Bioreactor）
            - text: 。
