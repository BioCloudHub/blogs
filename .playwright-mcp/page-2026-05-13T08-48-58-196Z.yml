          - paragraph [ref=e295]: 指示细胞培养法（Indicator Cell Culture Method）利用支原体能够附着并感染宿主细胞的生物学特性，将供试品接种于无支原体污染的指示细胞（首选 Vero 细胞，或经国家药品检定机构认可的其他细胞系）中共培养，随后使用特异性荧光 DNA 染料（如 Hoechst 33258/二苯甲酰胺）对细胞进行染色。
          - paragraph [ref=e296]: 若供试品中含有支原体，支原体 DNA 将在荧光显微镜下呈现附着于细胞表面的细小、不规则荧光颗粒，与细胞核荧光明显区别，从而实现对支原体污染的判定。
