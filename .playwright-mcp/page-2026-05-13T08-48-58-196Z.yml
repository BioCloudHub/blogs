          - paragraph [ref=e1200]:
            - strong [ref=e1201]: 抗体长循环半衰期的核心机制
          - paragraph [ref=e1202]: IgG 抗体的体内长循环半衰期（通常 14～21 天）主要归因于其与新生儿 Fc 受体（FcRn）的结合和再循环机制：
          - list [ref=e1203]:
            - listitem [ref=e1204]: 循环中的 IgG 被血管内皮细胞、巨噬细胞等表达的 FcRn 通过胞饮作用摄入；
            - listitem [ref=e1205]: 在酸性内体（pH ~6）中，IgG Fc 区 CH2/CH3 结构域与 FcRn 结合，阻止进入溶酶体降解途径；
            - listitem [ref=e1206]: 内体回到细胞膜后，IgG 在生理 pH 下从 FcRn 解离，重新释放入血液。
          - paragraph [ref=e1207]:
            - strong [ref=e1208]: 关键点：
            - text: FcRn 与 IgG 的结合位点位于 CH2/CH3 结构域表面，
            - strong [ref=e1209]: 与糖基化类型无关
            - text: ，因此 Fc 糖型对 FcRn 介导的半衰期延长影响有限。
          - paragraph [ref=e1210]:
            - strong [ref=e1211]: 糖型特异性受体与清除机制
          - paragraph [ref=e1212]: 影响半衰期的糖型相关受体主要有两类：
          - paragraph [ref=e1213]:
            - strong [ref=e1214]: ① 无唾液酸糖蛋白受体（ASGPR）
          - list [ref=e1215]:
            - listitem [ref=e1216]: 识别并结合糖蛋白末端的半乳糖（Gal）和 N-乙酰葡糖胺（GlcNAc）；
            - listitem [ref=e1217]: 介导内吞作用，加速糖蛋白的肝脏清除，理论上可缩短半衰期；
            - listitem [ref=e1218]:
              - strong [ref=e1219]: 然而
              - text: ，对于 IgG 抗体，Fc 区 N-糖位于 CH2 结构域内部（Asn297），受到蛋白空间位阻保护，ASGPR 难以接触到末端糖结构——因此
              - strong [ref=e1220]: Fc 糖型变化通常不影响单抗的 ASGPR 介导清除和半衰期
              - text: 。
          - paragraph [ref=e1221]:
            - strong [ref=e1222]: ② 甘露糖受体（Mannose Receptor, MR）
          - list [ref=e1223]:
            - listitem [ref=e1224]: 识别并结合糖蛋白末端甘露糖（Man）残基；
            - listitem [ref=e1225]: 高甘露糖型（High Mannose, Man5～Man9）单抗存在被甘露糖受体识别、内吞清除的理论风险。
          - paragraph [ref=e1226]:
            - strong [ref=e1227]: 高甘露糖型对半衰期的争议与主流共识
          - table [ref=e1228]:
            - rowgroup [ref=e1229]:
              - row "观点 依据" [ref=e1230]:
                - columnheader "观点" [ref=e1231]
                - columnheader "依据" [ref=e1232]
            - rowgroup [ref=e1233]:
              - row "高甘露糖型缩短半衰期 动物实验和部分临床数据显示高 Man 单抗清除加快" [ref=e1234]:
