            - strong [ref=e1289]: 作用机制
          - paragraph [ref=e1290]: 摇床通过旋转振荡运动为培养容器提供持续混合，实现：① 液相均匀混合（提高营养物质和代谢产物的传质效率）；② 气液界面的持续更新（增加 O₂ 溶解）；③ 维持培养体系的理化均一性。
